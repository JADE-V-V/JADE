# Some useful aliases to avoid duplication
_times: &times1
  86400s: 86400
  604800s: 604800
  1296000s: 1296000
  2592000s: 2592000
  5184000s: 5184000
# --------------------------------------------------------
_times2: &times2
  4380s: 4380
  6180s: 6180
  7488s: 7488
  11580s: 11580
  17280s: 17280
  24480s: 24480
  34080s: 34080
  45780s: 45780
  57240s: 57240
  72550s: 72550
  90720s: 90720
