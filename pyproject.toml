[build-system]
requires = ["setuptools >= 69.5.1", "setuptools_scm[toml]>=8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jadevv"
license = {file = "LICENSE"}
dynamic = ["version"]
authors = [
  { name="JADE dev team", email="sc-radiationtransport@f4e.europa.eu" },
]
description = "JADE, a V&V tool for nuclear data libraries and transport codes"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
]
dependencies = [
    "xlsxwriter < 4",
    "python-docx < 2",
    "matplotlib < 4",
    "requests < 3",
    "f4enix >= 1.2.1, < 2",
    "pyyaml < 7",
    "seaborn < 0.14",
    "python-gitlab < 9"
]

[project.optional-dependencies]
dev = [
    "pytest < 10",
    "pytest-cov < 8",
    "pytest-xvfb < 4",  # needed for headless display
    "ruff",  # best formatter that should be used by everybody
]
docs = [
    "sphinx < 10",
    "myst-parser < 6",
    "sphinx-book-theme < 2",
    "sphinx-copybutton < 0.6",
    "sphinx-togglebutton < 0.5",
    "sphinx-design < 0.8",
    "pydata-sphinx-theme < 1",
]
ui = [
    "ttkthemes < 4"
]

[project.urls]
Homepage = "https://github.com/JADE-V-V/JADE"
Repository = "https://github.com/JADE-V-V/JADE"
Documentation = "https://jade-a-nuclear-data-libraries-vv-tool.readthedocs.io/en/latest/"

# [project.scripts]
# jade = "jade.main:main"

[tool.setuptools_scm]
write_to = "src/_version.py"

[tool.setuptools.package-dir]
jade = 'src/jade'

[tool.setuptools.package-data]
"*" = ["*.txt", '*.csv', '*.sh', '*.cmd', '*.docx', '*.ico']

