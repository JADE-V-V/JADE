# --------------------------------------------------------
SDDR in air irr. 1:
  concat_option: no_action
  apply_to: FNG-SDDR_1
  100:
    - [replace, {'column': 'Time', 'values': *times1}]
    - [groupby, {by: 'Time', 'action': 'sum'}]
    - [scale, {'factor': 1.25300582110546e-10}] # this includes the volume and conversion to Sv/h
SDDR in air (daughters) irr. 1:
  apply_to: FNG-SDDR_1
  concat_option: no_action
  100: 
    - [replace, {'column': 'Time', 'values': *times1}]
    - [scale, {'factor': 1.25300582110546e-10}] # this includes the volume and conversion to Sv/h


SDDR in air irr. 2:
