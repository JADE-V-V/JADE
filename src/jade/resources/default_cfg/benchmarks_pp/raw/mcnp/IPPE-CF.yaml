# This is a configuration file for the MCNP benchmark IPPE-CF.
Neutron flux HPD:
   concat_option: no_action
   2:
     - [by_energy, {}]
Neutron flux SSD:
  concat_option: no_action
  12:
    - [by_energy, {}]

Coarse neutron flux HPD apply_to#1:
   concat_option: no_action
   apply_to: ["IPPE-CF_FE_S1_NP"]
   2:
    - [condense_groups, {"bins": [0.001, 0.01,0.03, 0.06, 0.1, 0.15, 0.2, 0.4, 0.5, 0.7], "group_column": "Energy"}]
    - [add_column, {"column": "Iron sphere diameter", "values": "IPPE-CF_FE_S1_NP (20cm diameter)"}]
