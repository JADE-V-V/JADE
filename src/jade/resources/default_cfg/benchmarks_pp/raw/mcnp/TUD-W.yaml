# normal binned fluxes
Neutron spectra:
  concat_option: no_action
  4:  
    - ['by_energy', {}]
    - ['gaussian_broadening', {
      'column': 'Energy',
      'bins': {
          '1.11':{'no_scaling':{'fwhm_frac':0.0}},
          '2.9745':{'no_scaling':{'fwhm_frac':0.1}},
          '3.664':{'no_scaling':{'fwhm_frac':0.05}},
          '13.836':{'no_scaling':{'fwhm_frac':0.03}},
          '15.5':{'no_scaling':{'fwhm_frac':0.02}}},
      'integral': false}]
Photon spectra:  
  concat_option: no_action
  44: [['by_energy', {}]]
# coarse fluxes
Neutron spectra coarse:
  concat_option: no_action
  4:
    - ['gaussian_broadening', {
      'column': 'Energy',
      'bins': {
          '1.11':{'no_scaling':{'fwhm_frac':0.0}},
          '2.9745':{'no_scaling':{'fwhm_frac':0.1}},
          '3.664':{'no_scaling':{'fwhm_frac':0.05}},
          '13.836':{'no_scaling':{'fwhm_frac':0.03}},
          '15.5':{'no_scaling':{'fwhm_frac':0.02}}},
      'integral': true}]
    - [condense_groups,
       {"bins": [1.15, 3, 6, 9, 12, 20],
        "group_column": "Energy"}
      ]
Photon spectra coarse:
  concat_option: no_action
  44:
    - [condense_groups,
       {"bins": [0.4, 3, 6, 10],
        "group_column": "Energy"}
      ]