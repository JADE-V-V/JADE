# --- Transport libraries ---
# ACTINV data combinations are configured separately; see usage/user_configuration.
# Example (replace the paths before enabling):
# TENDL2025-patched-ENDF8-JEFF33:
#   actinv:
#     path: /data/activation/tendl-2025-patched-neutron-709g.npz
#     decay_primary: /data/decay/endf-b-viii-0_decay.dat
#     decay_fallback: /data/decay/jeff-3-3_decay.dat
FENDL 3.2c:
  mcnp:
    path: /path/to/xsdir
    suffix: 32c
  openmc:
    path: pathtolib
  serpent:
    path: /path/to/xsdata
    suffix: 32c
#
FENDL 3.1d:
  mcnp:
    path: /path/to/xsdir
    suffix: 31c
  openmc:
    path: pathtolib
  serpent:
    path: /path/to/xsdata
    suffix: 31c
#
ENDFB-VIII.0:
  mcnp:
    path: /path/to/xsdir
    suffix: 00c
  openmc:
    path: pathtolib
  serpent:
    path: /path/to/xsdata
    suffix: 00c
#
IRDFF-II:
  mcnp:
    path: /path/to/xsdir
    suffix: 34y
  openmc:
    path: pathtolib
  serpent:
    path: /path/to/xsdata
    suffix: 34y
# --- Decay libraries ---
#
D1SUNED (FENDL 3.1d+EAF2007):
  d1s:
    path: /path/to/xsdir
    suffix: 99c
    transport_library_path: /path/to/xsdir
    transport_suffix: 32c
#
D1SUNED (FENDL 3.2b+TENDL2017):
  d1s:
    path: /path/to/xsdir
    suffix: 93c
    transport_library_path: /path/to/xsdir
    transport_suffix: 32c

