# normal binned fluxes
Neutron spectra:
  concat_option: no_action
  1:
    - ['by_energy', {}]
    - [format_decimals,{"decimals":{"Energy":2}}]
Photon spectra:
  concat_option: no_action
  2:
    - ['by_energy', {}]
    - [format_decimals,{"decimals":{"Energy":2}}]
# coarse fluxes
Neutron spectra coarse:
  concat_option: no_action
  1:
    - [condense_groups,
       {"bins": [1, 3, 6, 9, 12, 20],
        "group_column": "Energy"}
      ]
Photon spectra coarse:
  concat_option: no_action
  2:
    - [condense_groups,
       {"bins": [0.4, 3, 6, 10],
        "group_column": "Energy"}
      ]