SDDR in air irr. 1:
  concat_option: no_action
  apply_to: FNG-SDDR_1
  4: 
    - [replace, {'column': 'Time', 'values': *times1}]
SDDR in air (daughters) irr. 1:
  apply_to: FNG-SDDR_1
  concat_option: no_action
  14: 
  - [replace, {'column': 'Time', 'values': *times1}]
  - [replace, {'column': 'User', 'values': *daughters}]
SDDR in air (parents) irr. 1:
  apply_to: FNG-SDDR_1
  concat_option: no_action
  24: 
  - [replace, {'column': 'Time', 'values': *times1}]
  - [replace, {'column': 'User', 'values': *parents}]

